name: CTApprovedExpressionQualification
packages:
  LibroxTTS:
    path: ../..
targets:
  CTApprovedExpressionQualification:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: Sources
        excludes: [CLI.swift]
    dependencies:
      - package: LibroxTTS
        product: LibroxTTS
      - package: LibroxTTS
        product: KokoroPronunciation
      - package: LibroxTTS
        product: LibroxCTNative
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CT Approved Expression
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.section9labs.CTApprovedExpressionQualification
        DEVELOPMENT_TEAM: 995PCLM9KH
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '6.0'
        SWIFT_OPTIMIZATION_LEVEL: '-O'
        TARGETED_DEVICE_FAMILY: '1,2'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '0.1'
        SUPPORTS_MACCATALYST: NO
schemes:
  CTApprovedExpressionQualification:
    build:
      targets:
        CTApprovedExpressionQualification: all
    run:
      config: Release
