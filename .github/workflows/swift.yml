name: Swift
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift toolchain
        run: swift --version
      - name: Debug tests
        run: swift test --build-system swiftbuild
      - name: Release tests
        run: swift test --build-system swiftbuild -c release
      - name: Compile benchmark Python scripts
        run: python3 -m compileall -q Benchmarks/Narration Scripts/PocketTTS
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS example
        working-directory: Examples/KokoroDemo
        run: xcodegen generate
      - name: Build iOS example
        run: >-
          xcodebuild -project Examples/KokoroDemo/KokoroDemo.xcodeproj
          -scheme KokoroDemo -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath /tmp/kokoro-ci CODE_SIGNING_ALLOWED=NO build
