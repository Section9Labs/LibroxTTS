name: Swift
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift toolchain
        run: swift --version
      - name: Test API inventory checker
        run: python3 -m unittest discover -s Scripts/tests -p 'test_public_api.py'
      - name: Verify frozen public declarations
        run: |
          swift package --build-system swiftbuild dump-symbol-graph --minimum-access-level public --skip-synthesized-members
          python3 Scripts/check-public-api.py --additions docs/validation/api-1.1-additions.json
      - name: Debug tests
        run: swift test --build-system swiftbuild
      - name: Release tests
        run: swift test --build-system swiftbuild -c release
      - name: Compile benchmark Python scripts
        run: python3 -m compileall -q Benchmarks/Narration Scripts
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS example
        working-directory: Examples/KokoroDemo
        run: xcodegen generate
      - name: Build iOS example
        run: >-
          xcodebuild -project Examples/KokoroDemo/KokoroDemo.xcodeproj
          -scheme KokoroDemo -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath /tmp/kokoro-ci CODE_SIGNING_ALLOWED=NO build
      - name: Build Catalyst example
        run: >-
          xcodebuild -project Examples/KokoroDemo/KokoroDemo.xcodeproj
          -scheme KokoroDemo -configuration Release
          -destination 'generic/platform=macOS,variant=Mac Catalyst'
          -derivedDataPath /tmp/kokoro-ci CODE_SIGNING_ALLOWED=NO build
      - name: Preserve symbol graphs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-symbol-graphs
          path: .build/out/symbolgraph
          retention-days: 7
